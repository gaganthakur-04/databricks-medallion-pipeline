resources:
  jobs:
    medallion_pipeline:
      name: "[${bundle.target}] medallion-pipeline"
      description: >
        End-to-end Medallion pipeline: Bronze CSV ingest → Silver DQ validation → Gold analytics.
      tags:
        project: medallion-pipeline
        layer: end-to-end

      # Free Edition / Community Edition workspaces require serverless compute.
      environments:
        - environment_key: medallion_env
          spec:
            client: "1"
            dependencies:
              - ${workspace.root_path}/artifacts/.internal/medallion_pipeline-0.1.0-py3-none-any.whl

      tasks:
        - task_key: setup_schema
          environment_key: medallion_env
          spark_python_task:
            python_file: ../scripts/setup_schema.py

        - task_key: run_pipeline
          depends_on:
            - task_key: setup_schema
          environment_key: medallion_env
          spark_python_task:
            python_file: ../scripts/run_pipeline.py
            parameters:
              - "--input-dir"
              - ${var.csv_input_dir}
              - "--bronze-database"
              - ${var.bronze_database}
              - "--silver-database"
              - ${var.silver_database}
              - "--gold-database"
              - ${var.gold_database}
