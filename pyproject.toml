[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "medallion-pipeline"
version = "0.1.0"
description = "Databricks Medallion Architecture pipeline for e-commerce sales data"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
run-medallion-pipeline = "src.pipeline.run_all:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
